l" style="display:flex;align-items:unsafe center;justify-content:unsafe flex-start;width:646px;height:1px;padding-top:72px;margin-left:30px"><div style="box-sizing:border-box;font-size:0;text-align:left;color:var(--wd-fg, #1d1d1f)"><div style="display:inline-block;font-size:12px;font-family:var(--wd-font-sans);color:var(--wd-fg, #1d1d1f);line-height:1.2;pointer-events:all;white-space:normal;word-wrap:normal"><b>指纹 1 · 健康静态图重放（Device 利用 94%）</b><br/>Host 轨仅有单根 ~0.08 ms GraphLaunch / aclmdlRI，紧接着异步筹备 Step N+1；Device 轨 Norm/Attn/MoE/Head 首尾紧贴，D2H 隐藏重叠</div></div></div></foreignObject><text x="30" y="62" fill="var(--wd-fg, #1d1d1f)" font-family="var(--wd-font-sans)" font-size="12"><tspan x="30" y="62">指纹 1 · 健康静态图重放（Device 利用 94%）</tspan><tspan x="30" y="76">Host 轨仅有单根 ~0.08 ms GraphLaunch / aclmdlRI，紧接着异步筹备 Step N+1；Device 轨 Norm/Attn/MoE/Head</tspan><tspan x="30" y="90">首尾紧贴，D2H 隐藏重叠</tspan></text></switch></g><g data-cell-id="r2"><rect width="672" height="64" x="16" y="120" fill="var(--wd-amber-fill, #fbf2df)" stroke="var(--wd-amber, #7b5518)" stroke-width="1.25" pointer-events="all" rx="4" ry="4" transform="translate(.5 .5)"/><switch><foreignObject width="100%" height="100%" pointer-events="none" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:unsafe center;justify-content:unsafe flex-start;width:646px;height:1px;padding-top:152px;margin-left:30px"><div style="box-sizing:border-box;font-size:0;text-align:left;color:var(--wd-fg, #1d1d1f)"><div style="display:inline-block;font-size:12px;font-family:var(--wd-font-sans);color:var(--wd-fg, #1d1d1f);line-height:1.2;pointer-events:all;white-space:normal;word-wrap:normal"><b>指纹 2 · 启动受限锯齿（Device 跌至 38% → 静默退回 Eager / NONE）</b><br/>Host 排满逐算子宽发射块，Device 算子被碎片气泡切碎；先设 torch_profiler_with_stack=false 排除采集伪影，再查超桶 / splitting_ops</div></div></div></foreignObject><text x="30" y="142" fill="var(--wd-fg, #1d1d1f)" font-family="var(--wd-font-sans)" font-size="12"><tspan x="30" y="142">指纹 2 · 启动受限锯齿（Device 跌至 38% → 静默退回 Eager / NONE）</tspan><tspan x="30" y="156">Host 排满逐算子宽发射块，Device 算子被碎片气泡切碎；先设 torch_profiler_with_stack=false</tspan><tspan x="30" y="170">排除采集伪影，再查超桶 / splitting_ops</tspan></text></switch></g><g data-cell-id="r3"><rect width="672" height="64" x="16" y="200" fill="var(--wd-rose-fill, #fcedec)" stroke="var(--wd-rose, #984646)" stroke-width="1.25" pointer-events="all" rx="4" ry="4" transform="translate(.5 .5)"/><switch><foreignObject width="100%" height="100%" pointer-events="none" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:unsafe center;justify-content:unsafe flex-start;width:646px;height:1px;padding-top:232px;margin-left:30px"><div style="box-sizing:border-box;font-size:0;text-align:left;color:var(--wd-fg, #1d1d1f)"><div style="display:inline-block;font-size:12px;font-family:var(--wd-font-sans);color:var(--wd-fg, #1d1d1f);line-height:1.2;pointer-events:all;white-space:normal;word-wrap:normal"><b>指纹 3 · Host 隐式同步排空墙（突发性全流停顿）</b><br/>Host 出现长条 cudaStreamSynchronize / aclrtSynchronizeStream + 4 B D2H 拷贝（.item()/.cpu()），Device 队列排空空转；用 VLLM_GPU_SYNC_CHECK 拦截</div></div></div></foreignObject><text x="30" y="222" fill="var(--wd-fg, #1d1d1f)" font-family="var(--wd-font-sans)" font-size="12"><tspan x="30" y="222">指纹 3 · Host 隐式同步排空墙（突发性全流停顿）</tspan><tspan x="30" y="236">Host 出现长条 cudaStreamSynchronize / aclrtSynchronizeStream + 4 B D2H 拷贝（.item()/.cpu()），Device</tspan><tspan x="30" y="250">队列排空空转；用 VLLM_GPU_SYNC_CHECK 拦截</tspan></text></switch></g><g data-cell-id="r4"><rect width="672" height="64" x="16" y="280" fill="var(--wd-amber-fill, #fbf2df)" stroke="var(--wd-amber, #7b5518)" stroke-width="1.25" pointer-events="all" rx="4" ry="4" transform="translate(.5 .5)"/><switch><foreignObject width="100%" height="100%" pointer-events="none" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:unsafe center;justify-content:unsafe flex-start;width:646px;height:1px;padding-top:312px;margin-left:30px"><div style="box-sizing:border-box;font-size:0;text-align:left;color:var(--wd-fg, #1d1d1f)"><div style="display:inline-block;font-size:12px;font-family:var(--wd-font-sans);color:var(--wd-fg, #1d1d1f);line-height:1.2;pointer-events:all;white-space:normal;word-wrap:normal"><b>指纹 4 · DP 跨卡长尾等待（Device 利用 58%）</b><br/>快卡 Rank 0 早早算完却卡在 NCCL / HCCL All-to-All 长块等待；根因在同伴卡 Rank 1 承接长 Prefill Attn 或 dp_utils 负载不均</div></div></div></foreignObject><text x="30" y="302" fill="var(--wd-fg, #1d1d1f)" font-family="var(--wd-font-sans)" font-size="12"><tspan x="30" y="302">指纹 4 · DP 跨卡长尾等待（Device 利用 58%）</tspan><tspan x="30" y="316">快卡 Rank 0 早早算完却卡在 NCCL / HCCL All-to-All 长块等待；根因在同伴卡 Rank 1 承接长 Prefill Attn 或 dp_utils</tspan><tspan x="30" y="330">负载不均</tspan></text></switch></g><g data-cell-id="r5"><rect width="672" height="64" x="16" y="360" fill="var(--wd-rose-fill, #fcedec)" stroke="var(--wd-rose, #984646)" stroke-dasharray="4.5 4.5" stroke-width="1.5" pointer-events="all" rx="4" ry="4"/><switch><foreignObject width="100%" height="100%" pointer-events="none" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:unsafe center;justify-content:unsafe flex-start;width:646px;height:1px;padding-top:392px;margin-left:30px"><div style="box-sizing:border-box;font-size:0;text-align:left;color:var(--wd-fg, #1d1d1f)"><div style="display:inline-block;font-size:12px;font-family:var(--wd-font-sans);color:var(--wd-fg, #1d1d1f);line-height:1.2;pointer-events:all;white-space:normal;word-wrap:normal"><b>指纹 5 · 脏 Padding 尾部越界 / 异步 507011（表观紧凑无洞，输出乱码）</b><br/>B=4 缩至 B=2 遗漏刷写 PAD_SLOT_ID=-1 或持久缓冲（sinks）提前回收，在无关同步点暴雷；开 LOGGING=DEBUG 核 data_ptr() 与 -1 槽</div></div></div></foreignObject><text x="30" y="382" fill="var(--wd-fg, #1d1d1f)" font-family="var(--wd-font-sans)" font-size="12"><tspan x="30" y="382">指纹 5 · 脏 Padding 尾部越界 / 异步 507011（表观紧凑无洞，输出乱码）</tspan><tspan x="30" y="396">B=4 缩至 B=2 遗漏刷写 PAD_SLOT_ID=-1 或持久缓冲（sinks）提前回收，在无关同步点暴雷；开 LOGGING=DEBUG 核</tspan><tspan x="30" y="410">data_ptr() 与 -1 槽</tspan></text></switch></g></g></g><switch><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/><a xlink:href="https://www.drawio.com/doc/faq/svg-export-text-problems" target="_blank" transform="translate(0 -5)"><text x="50%" y="100%" font-size="10" text-anchor="middle">Text is not SVG - cannot display</text></a></switch></svg>
