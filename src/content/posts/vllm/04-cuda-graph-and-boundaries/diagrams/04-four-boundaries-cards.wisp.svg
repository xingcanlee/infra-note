<svg xmlns="http://www.w3.org/2000/svg" class="wisp-d" viewBox="0 0 696 328" width="696" height="328" role="img" aria-labelledby="d-04-four-boundaries-cards-title d-04-four-boundaries-cards-desc" data-wisp-diagram="1" data-source="04-four-boundaries-cards.excalidraw" data-style="hand"><title id="d-04-four-boundaries-cards-title">04 four boundaries cards</title><desc id="d-04-four-boundaries-cards-desc">约束一：输入输出指针固定 • 捕获硬编码张量虚拟地址 (data_ptr) • 重放必须原位 copy_() 覆写静态缓冲 • 重新赋值将导致图仍读取旧地址 0x7f00_1000 • 末图启用 weak_ref_tensors() 释放中间结果；约束二：静态批形与零分配 • 真实 Batch 必须垫齐进 Capture 桶 • 禁止图内按运行时标量动态申请张量 • 捕获共享 global_graph_pool 控制显存 • Padding 槽位 slot_mapping 须刷写为 -1；约束三：零主机控制流同步 • 禁止图内调用 .item() / .cpu() / .tolist() •…</desc><style data-wisp-vars="1">.wisp-d{--wd-blue:#2f5783;--wd-blue-fill:#e9f2fb;--wd-amber:#7b5518;--wd-amber-fill:#fbf2df;--wd-green:#2c522d;--wd-green-fill:#e9f5e9;--wd-rose:#984646;--wd-rose-fill:#fcedec;--wd-violet:#4d335c;--wd-violet-fill:#f5eef9;--wd-teal:#0f766e;--wd-teal-fill:#e3f5f3;--wd-orange:#762f06;--wd-orange-fill:#fceee4;--wd-slate:#464e57;--wd-slate-fill:#eaedf2;--wd-bg:transparent;--wd-surface:#f4f4f2;--wd-surface-2:#ebebe7;--wd-border:#e2e2dd;--wd-fg:#1d1d1f;--wd-muted:#5c6067;--wd-subtle:#8b9098;--wd-accent:#0f766e;--wd-font-sans:Inter,&quot;Noto Sans SC&quot;,-apple-system,BlinkMacSystemFont,&quot;PingFang SC&quot;,&quot;HarmonyOS Sans SC&quot;,MiSans,&quot;Noto Sans CJK SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;--wd-font-mono:&quot;JetBrains Mono&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Noto Sans SC&quot;,&quot;PingFang SC&quot;,monospace;--wd-font-hand:Excalifont,Virgil,&quot;Noto Sans SC&quot;,&quot;PingFang SC&quot;,sans-serif}@media (prefers-color-scheme:dark){.wisp-d{--wd-blue:#a9cbef;--wd-blue-fill:#1a2634;--wd-amber:#f2c681;--wd-amber-fill:#2e2515;--wd-green:#84b585;--wd-green-fill:#1a281c;--wd-rose:#eda9aa;--wd-rose-fill:#341f1f;--wd-violet:#bb9ece;--wd-violet-fill:#291e2e;--wd-teal:#7fd3c5;--wd-teal-fill:#112926;--wd-orang