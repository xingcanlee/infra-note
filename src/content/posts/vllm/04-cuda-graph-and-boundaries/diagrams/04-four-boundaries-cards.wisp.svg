" font-family="var(--wd-font-hand)" font-size="14" style="white-space:pre" text-anchor="middle" transform="translate(17.657 27.5)">• 重新赋值将导致图仍读取旧地址 0x7f00_1000</text><text x="154.343" y="99.834" fill="var(--wd-fg, #1d1d1f)" direction="ltr" dominant-baseline="alphabetic" font-family="var(--wd-font-hand)" font-size="14" style="white-space:pre" text-anchor="middle" transform="translate(17.657 27.5)">• 末图启用 weak_ref_tensors() 释放中间结果</text><g stroke-linecap="round"><path fill="var(--wd-amber-fill, #fbf2df)" stroke="none" stroke-width="0" d="M364 8c69.7-6.01 136.28-4.97 320 0-.45-1.91 7.03 1.09 4 4-3.05 47.95-1.9 93.42 0 136 .27 3.06-3.51.73-4 4-76.23.4-158.89-1.4-320 0-4.84-1.21-6.73-.41-4-4 3.91-52.26 3.79-104.19 0-136-1.02-1.74-.26-7.03 4-4"/><path fill="none" stroke="var(--wd-amber, #7b5518)" stroke-width="2" d="M364 8c125.9 1.83 249.46 1.66 320 0M364 8c63.8-.84 128.92-.3 320 0m0 0c1.11-.08 5.37 2.95 4 4m-4-4c1.61.53 5.16.72 4 4m0 0c-1.85 41.33 1.25 85.61 0 136m0-136c-.35 50.83-.41 102.29 0 136m0 0c.9 3.23-1.99 3.35-4 4m4-4c.78 2.15.71 3.84-4 4m0 0c-65.46-.46-129.82 1-320 0m320 0c-110.13-1.66-222.01-2.31-320 0m0 0c-2.64-1.38-2.77-3.22-4-4m4 4c-1.41-.73-4.57-2.38-4-4m0 0c-.5-54.42-1.21-105.22 0-136m0 136c-1.11-35.75-1.07-73.3 0-136m0 0c1.75-1.97 1.68-4.28 4-4m-4 4c1.01-3.81 3.51-4.37 4-4"/></g><text x="135.296" y="12.334" fill="var(--wd-fg, #1d1d1f)" direction="ltr" dominant-baseline="alphabetic" font-family="var(--wd-font-hand)" font-size="14" style="white-space:pre" text-anchor="middle" transform="translate(388.704 27.5)">约束二：静态批形与零分配</text><text x="135.296" y="47.334" fill="var(--wd-fg, #1d1d1f)" direction="ltr" dominant-baseline="alphabetic" font-family="var(--wd-font-hand)" font-size="14" style="white-space:pre" text-anchor="middle" transform="translate(388.704 27.5)">• 真实 Batch 必须垫齐进 Capture 桶</text><text x="135.296" y="64.834" fill="var(--wd-fg, #1d1d1f)" direction="ltr" dominant-baseline="alphabetic" font-family="var(--wd-font-hand)" font-size="14" style="white-space:pre" text-anchor="middle" transform="translate(388.704 27.5)">• 禁止图内按运行时标量动态申请张量</text><text x="135.296" y="82.334" fill="var(--wd-fg, #1d1d1f)" direction="ltr" dominant-baseline="alphabetic" font-family="var(--wd-font-hand)" font-size="14" style="white-space:pre" text-anchor="middle" transform="translate(388.704 27.5)">• 捕获共享 global_graph_pool 控制显存</text><text x="135.296" y="99.834" fill="var(--wd-fg, #1d1d1f)" direction="ltr" dominant-baseline="alphabetic" font-family="var(--wd-font-hand)" font-size="14" style="white-space:pre" text-anchor="middle" transform="translate(388.704 27.5)">• Padding 槽位 slot_mapping 须刷写为 -1</text><g stroke-linecap="round"><path fill="var(--wd-rose-fill, #fcedec)" stroke="none" stroke-width="0" d="M12 176c120.43-2.55 244.07-4.42 320 0 .76 3.03 3.75 2.61 4 4 3.75 39 3.61 82.13 0 136 .39.49-4.6 2.02-4 4-111.82 1.39-225.04 1.95-320 0-3.87-2.73-3.08 1.67-4-4 1.35-27.89 1.58-60.37 0-136 .92-4.26-1.7-2.41 4-4"/><path fill="none" stroke="var(--wd-rose, #984646)" stroke-width="2" d="M12 176c107.07-1.96 212.81-2.93 320 0m-320 0c76.92 2.12 154.78 1.58 320 0m0 0c2.58 1.37 5.62.41 4 4m-4-4c3.19 1.16 3.39 1.72 4 4m0 0c-2.73 36.68-1.53 71.21 0 136m0-136c.88 43.43 1.14 88.82 0 136m0 0c.57 2.01-1.99 4.68-4 4m4-4c-.51 4.71-1.49 1.79-4 4m0 0c-89.34.57-176.46.4-320 0m320 0c-74.05 1.39-148.89 1.94-320 0m0 0c-4.04 1.23-5.88-.24-4-4m4 4c-3.39-.57-5.05.77-4-4m0 0c-.87-52.31 1.54-105.17 0-136m0 136c.61-43.68-.72-84.75 0-136m0 0c.7-2.32 1.05-3.12 4-4m-4 4c-1.14-.49.96-5.99 4-4"/></g><text x="144.165" y="12.334" fill="var(--wd-fg, #1d1d1f)" direction="ltr" dominant-baseline="alphabetic" font-family="var(--wd-font-hand)" font-size="14" style="white-space:pre" text-anchor="middle" transform="translate(27.835 195.5)">约束三：零主机控制流同步</text><text x="144.165" y="47.334" fill="var(--wd-fg, #1d1d1f)" direction="ltr" dominant-baseline="alphabetic" font-family="var(--wd-font-hand)" font-size="14" style="white-space:pre" text-anchor="middle" transform="translate(27.835 195.5)">• 禁止图内调用 .item() / .cpu() / .tolist()</text><text x="144.165" y="64.834" fill="var(--wd-fg, #1d1d1f)" direction="ltr" dominant-baseline="alphabetic" font-family="var(--wd-font-hand)" font-size="14" style="white-space:pre" text-anchor="middle" transform="translate(27.835 195.5)">• 禁止数据依赖分支与 torch.nonzero()</text><text x="144.165" y="82.334" fill="var(--wd-fg, #1d1d1f)" direction="ltr" dominant-baseline="alphabetic" font-family="var(--wd-font-hand)" font-size="14" style="white-space:pre" text-anchor="middle" transform="translate(27.835 195.5)">• 分支条件须前置至 Runner CPU 侧</text><text x="144.165" y="99.834" fill="var(--wd-fg, #1d1d1f)" direction="ltr" dominant-baseline="alphabetic" font-family="var(--wd-font-hand)" font-size="14" style="white-space:pre" text-anchor="middle" transform="translate(27.835 195.5)">• 违例直接触发 StreamCaptureUnsupported</text><g stroke-linecap="round"><path fill="var(--wd-slate-fill, #eaedf2)" stroke="none" stroke-width="0" d="M364 176c126.1 2.34 250.65 2.15 320 0 5.69-.25 5.28 1.37 4 4-4.02 50.87-1.81 97.76 0 136-2.18-.6-3.31 5.73-4 4-104.47-2.85-206.29-1.49-320 0-5.4.92-.99-4.28-4-4 .5-32.58-2.31-64.48 0-136-1.59-5.7 2.92-4.73 4-4"/><path fill="none" stroke="var(--wd-slate, #464e57)" stroke-width="1.25" d="M364 176c85.88-.87 171.2-2.66 320 0m-320 0c102.32 1.4 204.11 1.23 320 0m0 0c4.03 1.62 3.08 1.79 4 4m-4-4c3.83-.61 4.39.32 4 4m0 0c.99 30.57.68 62.76 0 136m0-136c-1.68 53.34-.48 107.23 0 136m0 0c-.66 2.01-.65 3.55-4 4m4-4c2.05 2.51-3.54 3.47-4 4m0 0c-99.62-.54-200.23-2.18-320 0m320 0c-70.92-.08-140.75-.05-320 0m0 0c-1.44-1.88-2.9-1.96-4-4m4 4c-3.23-1.05-1.9.6-4-4m0 0c-.51-36.36-1.11-74.85 0-136m0 136c.36-40.36 2.11-78.68 0-136m0 0c.35-2.95 2.22-4.99 4-4m-4 4c2.17-3.04-.66-2.09 4-4"/></g><text x="143.976" y="12.334" fill="var(--wd-fg, #1d1d1f)" direction="ltr" dominant-baseline="alphabetic" font-family="var(--wd-font-hand)" font-size="14" style="white-space:pre" text-anchor="middle" transform="translate(380.024 195.5)">约束四：副流汇合与通信池隔离</text><text x="143.976" y="47.334" fill="var(--wd-fg, #1d1d1f)" direction="ltr" dominant-baseline="alphabetic" font-family="var(--wd-font-hand)" font-size="14" style="white-space:pre" text-anchor="middle" transform="translate(380.024 195.5)">• 旁路拷贝流必须经 Event 汇回主流</text><text x="143.976" y="64.834" fill="var(--wd-fg, #1d1d1f)" direction="ltr" dominant-baseline="alphabetic" font-family="var(--wd-font-hand)" font-size="14" style="white-space:pre" text-anchor="middle" transform="translate(380.024 195.5)">• Offloader 末尾执行 join_after_forward()</text><text x="143.976" y="82.334" fill="var(--wd-fg, #1d1d1f)" direction="ltr" dominant-baseline="alphabetic" font-family="var(--wd-font-hand)" font-size="14" style="white-space:pre" text-anchor="middle" transform="translate(380.024 195.5)">• 对称内存切换至 nccl_symm_mem_context</text><text x="143.976" y="99.834" fill="var(--wd-fg, #1d1d1f)" direction="ltr" dominant-baseline="alphabetic" font-family="var(--wd-font-hand)" font-size="14" style="white-space:pre" text-anchor="middle" transform="translate(380.024 195.5)">• 暂停 graph_pool 后登记跨卡通信窗地址</text></svg>
