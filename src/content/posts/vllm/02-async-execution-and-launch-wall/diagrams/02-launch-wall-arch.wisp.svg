span></text></switch></g><g data-cell-id="st_rt"><rect width="144" height="80" x="352" y="40" fill="var(--wd-blue-fill, #e9f2fb)" stroke="var(--wd-blue, #2f5783)" stroke-width="1.25" pointer-events="all" rx="4" ry="4" transform="translate(.5 .5)"/><switch><foreignObject width="100%" height="100%" pointer-events="none" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:unsafe center;justify-content:unsafe center;width:142px;height:1px;padding-top:80px;margin-left:353px"><div style="box-sizing:border-box;font-size:0;text-align:center;color:var(--wd-fg, #1d1d1f)"><div style="display:inline-block;font-size:12px;font-family:var(--wd-font-sans);color:var(--wd-fg, #1d1d1f);line-height:1.2;pointer-events:all;white-space:normal;word-wrap:normal"><b>3. Runtime 入队</b><br/>cudaLaunchKernel /<br/>CANN aclnn 异步压入流</div></div></div></foreignObject><text x="424" y="70" fill="var(--wd-fg, #1d1d1f)" font-family="var(--wd-font-sans)" font-size="12" text-anchor="middle"><tspan x="424" y="70">3. Runtime 入队</tspan><tspan x="424" y="84">cudaLaunchKernel /</tspan><tspan x="424" y="98">CANN aclnn 异步压入流</tspan></text></switch></g><g data-cell-id="st_dev"><rect width="136" height="80" x="520" y="40" fill="var(--wd-green-fill, #e9f5e9)" stroke="var(--wd-green, #2c522d)" stroke-width="1.25" pointer-events="all" rx="4" ry="4" transform="translate(.5 .5)"/><switch><foreignObject width="100%" height="100%" pointer-events="none" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:unsafe center;justify-content:unsafe center;width:134px;height:1px;padding-top:80px;margin-left:521px"><div style="box-sizing:border-box;font-size:0;text-align:center;color:var(--wd-fg, #1d1d1f)"><div style="display:inline-block;font-size:12px;font-family:var(--wd-font-sans);color:var(--wd-fg, #1d1d1f);line-height:1.2;pointer-events:all;white-space:normal;word-wrap:normal"><b>4. Device 流执行</b><br/>CUDA / Ascend 流<br/>实际运行 ~8us</div></div></div></foreignObject><text x="588" y="70" fill="var(--wd-fg, #1d1d1f)" font-family="var(--wd-font-sans)" font-size="12" text-anchor="middle"><tspan x="588" y="70">4. Device 流执行</tspan><tspan x="588" y="84">CUDA / Ascend 流</tspan><tspan x="588" y="98">实际运行 ~8us</tspan></text></switch></g><g data-cell-id="e_12"><path fill="none" stroke="var(--wd-muted, #5c6067)" stroke-miterlimit="10" stroke-width="1.5" d="M160 80h12-4 6.82" pointer-events="stroke"/><path fill="var(--wd-muted, #5c6067)" stroke="var(--wd-muted, #5c6067)" stroke-miterlimit="10" stroke-width="1.5" d="m182.32 80-7.5 3.75v-7.5Z" pointer-events="all"/></g><g data-cell-id="e_23"><path fill="none" stroke="var(--wd-muted, #5c6067)" stroke-miterlimit="10" stroke-width="1.5" d="M328 80h12-4 6.82" pointer-events="stroke"/><path fill="var(--wd-muted, #5c6067)" stroke="var(--wd-muted, #5c6067)" stroke-miterlimit="10" stroke-width="1.5" d="m350.32 80-7.5 3.75v-7.5Z" pointer-events="all"/></g><g data-cell-id="e_34"><path fill="none" stroke="var(--wd-muted, #5c6067)" stroke-miterlimit="10" stroke-width="1.5" d="M496 80h12-4 6.82" pointer-events="stroke"/><path fill="var(--wd-muted, #5c6067)" stroke="var(--wd-muted, #5c6067)" stroke-miterlimit="10" stroke-width="1.5" d="m518.32 80-7.5 3.75v-7.5Z" pointer-events="all"/></g><g data-cell-id="b_left"><rect width="312" height="104" x="8" y="168" fill="var(--wd-blue-fill, #e9f2fb)" stroke="var(--wd-blue, #2f5783)" stroke-width="1.25" pointer-events="all" rx="4" ry="4" transform="translate(.5 .5)"/><switch><foreignObject width="100%" height="100%" pointer-events="none" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:unsafe center;justify-content:unsafe flex-start;width:298px;height:1px;padding-top:220px;margin-left:22px"><div style="box-sizing:border-box;font-size:0;text-align:left;color:var(--wd-fg, #1d1d1f)"><div style="display:inline-block;font-size:12px;font-family:var(--wd-font-sans);color:var(--wd-fg, #1d1d1f);line-height:1.2;pointer-events:all;white-space:normal;word-wrap:normal"><b>瓶颈 A：步间调度与回传等待（本章解决）</b><br/>• Scheduler.schedule() 组批 + 块表维护<br/>• ModelRunner.prepare_inputs() 填张量<br/>• 步尾采样 D2H 拷贝（等待 GPU 结果再算下一步）</div></div></div></foreignObject><text x="22" y="203" fill="var(--wd-fg, #1d1d1f)" font-family="var(--wd-font-sans)" font-size="12"><tspan x="22" y="203">瓶颈 A：步间调度与回传等待（本章解决）</tspan><tspan x="22" y="217">• Scheduler.schedule() 组批 + 块表维护</tspan><tspan x="22" y="231">• ModelRunner.prepare_inputs() 填张量</tspan><tspan x="22" y="245">• 步尾采样 D2H 拷贝（等待 GPU 结果再算下一步）</tspan></text></switch></g><g data-cell-id="s_left"><rect width="312" height="104" x="8" y="296" fill="var(--wd-green-fill, #e9f5e9)" stroke="var(--wd-green, #2c522d)" stroke-width="1.25" pointer-events="all" rx="4" ry="4" transform="translate(.5 .5)"/><switch><foreignObject width="100%" height="100%" pointer-events="none" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:unsafe center;justify-content:unsafe flex-start;width:298px;height:1px;padding-top:348px;margin-left:22px"><div style="box-sizing:border-box;font-size:0;text-align:left;color:var(--wd-fg, #1d1d1f)"><div style="display:inline-block;font-size:12px;font-family:var(--wd-font-sans);color:var(--wd-fg, #1d1d1f);line-height:1.2;pointer-events:all;white-space:normal;word-wrap:normal"><b>解法：Async Scheduling + 预分配缓冲</b><br/>• step_with_batch_queue 与 AsyncScheduler 提前排布 step t+1<br/>• AsyncOutput 在独立 copy_stream 异步 D2H<br/>• InputBuffers 常驻显存避免步间反复 malloc</div></div></div></foreignObject><text x="22" y="324" fill="var(--wd-fg, #1d1d1f)" font-family="var(--wd-font-sans)" font-size="12"><tspan x="22" y="324">解法：Async Scheduling + 预分配缓冲</tspan><tspan x="22" y="338">• step_with_batch_queue 与 AsyncScheduler</tspan><tspan x="22" y="352">提前排布 step t+1</tspan><tspan x="22" y="366">• AsyncOutput 在独立 copy_stream 异步 D2H</tspan><tspan x="22" y="380">• InputBuffers 常驻显存避免步间反复 malloc</tspan></text></switch></g><g data-cell-id="el_down"><path fill="none" stroke="var(--wd-blue, #2f5783)" stroke-miterlimit="10" stroke-width="1.5" d="M164 272v12-4 6.82" pointer-events="stroke"/><path fill="var(--wd-blue, #2f5783)" stroke="var(--wd-blue, #2f5783)" stroke-miterlimit="10" stroke-width="1.5" d="m164 294.32-3.75-7.5h7.5Z" pointer-events="all"/></g><g data-cell-id="b_right"><rect width="312" height="104" x="360" y="168" fill="var(--wd-rose-fill, #fcedec)" stroke="var(--wd-rose, #984646)" stroke-width="1.25" pointer-events="all" rx="4" ry="4" transform="translate(.5 .5)"/><switch><foreignObject width="100%" height="100%" pointer-events="none" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:unsafe center;justify-content:unsafe flex-start;width:290px;height:1px;padding-top:220px;margin-left:374px"><div style="box-sizing:border-box;font-size:0;text-align:left;color:var(--wd-fg, #1d1d1f)"><div style="display:inline-block;font-size:12px;font-family:var(--wd-font-sans);color:var(--wd-fg, #1d1d1f);line-height:1.2;pointer-events:all;white-space:normal;word-wrap:normal"><b>瓶颈 B：步内逐算子发射墙（本章无法单独消除）</b><br/>• 每次 decode 仍需在 forward() 跑 300+ 次 Python/C++<br/>• 320 ops × ~20us = 6.4ms CPU，远超 2.56ms 设备计算<br/>• 单开 Async Scheduling 仍受限（加速比仅 1.00x）</div></div></div></foreignObject><text x="374" y="189" fill="var(--wd-fg, #1d1d1f)" font-family="var(--wd-font-sans)" font-size="12"><tspan x="374" y="189">瓶颈 B：步内逐算子发射墙（本章无法单独消除）</tspan><tspan x="374" y="203">• 每次 decode 仍需在 forward() 跑 300+ 次</tspan><tspan x="374" y="217">Python/C++</tspan><tspan x="374" y="231">• 320 ops × ~20us = 6.4ms CPU，远超 2.56ms</tspan><tspan x="374" y="245">设备计算</tspan><tspan x="374" y="259">• 单开 Async Scheduling 仍受限（加速比仅 1.00x）</tspan></text></switch></g><g data-cell-id="s_right"><rect width="312" height="104" x="360" y="296" fill="var(--wd-green-fill, #e9f5e9)" stroke="var(--wd-green, #2c522d)" stroke-width="1.25" pointer-events="all" rx="4" ry="4" transform="translate(.5 .5)"/><switch><foreignObject width="100%" height="100%" pointer-events="none" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:unsafe center;justify-content:unsafe flex-start;width:290px;height:1px;padding-top:348px;margin-left:374px"><div style="box-sizing:border-box;font-size:0;text-align:left;color:var(--wd-fg, #1d1d1f)"><div style="display:inline-block;font-size:12px;font-family:var(--wd-font-sans);color:var(--wd-fg, #1d1d1f);line-height:1.2;pointer-events:all;white-space:normal;word-wrap:normal"><b>后续解法（第 03–06 篇）：算子融合与图重放</b><br/>• torch.compile + Piecewise 编译整合 Python 碎块<br/>• CUDA Graph / ACLGraph 整步仅 1 次 ~45us 发射<br/>• 与 Async Scheduling 叠加：提速 2.63x，利用率 97.6%</div></div></div></foreignObject><text x="374" y="324" fill="var(--wd-fg, #1d1d1f)" font-family="var(--wd-font-sans)" font-size="12"><tspan x="374" y="324">后续解法（第 03–06 篇）：算子融合与图重放</tspan><tspan x="374" y="338">• torch.compile + Piecewise 编译整合 Python 碎块</tspan><tspan x="374" y="352">• CUDA Graph / ACLGraph 整步仅 1 次 ~45us 发射</tspan><tspan x="374" y="366">• 与 Async Scheduling 叠加：提速 2.63x，利用率</tspan><tspan x="374" y="380">97.6%</tspan></text></switch></g><g data-cell-id="er_down"><path fill="none" stroke="var(--wd-rose, #984646)" stroke-miterlimit="10" stroke-width="1.5" d="M516 272v12-4 6.82" pointer-events="stroke"/><path fill="var(--wd-rose, #984646)" stroke="var(--wd-rose, #984646)" stroke-miterlimit="10" stroke-width="1.5" d="m516 294.32-3.75-7.5h7.5Z" pointer-events="all"/></g><g data-cell-id="e_stack_l"><path fill="none" stroke="var(--wd-muted, #5c6067)" stroke-miterlimit="10" stroke-width="1.25" d="M192.5 120.5v22q0 10-10 10h-9q-9 0-9 3.68v3.67" pointer-events="stroke"/><path fill="var(--wd-muted, #5c6067)" stroke="var(--wd-muted, #5c6067)" stroke-miterlimit="10" stroke-width="1.25" d="m164.5 167.1-3.62-7.25h7.25Z" pointer-events="all"/></g><g data-cell-id="e_stack_r"><path fill="none" stroke="var(--wd-muted, #5c6067)" stroke-miterlimit="10" stroke-width="1.25" d="M288.5 120.5v22q0 10 10 10h208q10 0 10 3.68v3.67" pointer-events="stroke"/><path fill="var(--wd-muted, #5c6067)" stroke="var(--wd-muted, #5c6067)" stroke-miterlimit="10" stroke-width="1.25" d="m516.5 167.1-3.62-7.25h7.25Z" pointer-events="all"/></g></g></g><switch><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/><a xlink:href="https://www.drawio.com/doc/faq/svg-export-text-problems" target="_blank" transform="translate(0 -5)"><text x="50%" y="100%" font-size="10" text-anchor="middle">Text is not SVG - cannot display</text></a></switch></svg>
