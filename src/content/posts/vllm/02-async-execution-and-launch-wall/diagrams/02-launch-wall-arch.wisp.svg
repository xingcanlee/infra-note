<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="wisp-d" viewBox="0 0 691 419" width="691" height="419" role="img" aria-labelledby="d-02-launch-wall-arch-title d-02-launch-wall-arch-desc" data-wisp-diagram="1" data-source="02-launch-wall-arch.drawio" data-style="clean" data-page="PyTorch Launch Stack and Two Orthogonally Addressed Overheads"><title id="d-02-launch-wall-arch-title">PyTorch Launch Stack and Two Orthogonally Addressed Overheads</title><desc id="d-02-launch-wall-arch-desc">PyTorch Eager 单算子发射链（每次小算子重复 ~15–30us Host 开销 vs ~5–15us 设备算子执行）；1. Python 层 Module.__call__ 动态构造 Tensor / 校验；2. C++ Dispatcher DispatchKeySet 解析 Autograd / Backend 路由；3. Runtime 入队 cudaLaunchKernel / CANN aclnn 异步压入流；4. Device 流执行 CUDA / Ascend 流 实际运行 ~8us；瓶颈 A：步间调度与回传等待（本章解决） • Scheduler.schedule…</desc><style data-wisp-vars="1">.wisp-d{--wd-blue:#2f5783;--wd-blue-fill:#e9f2fb;--wd-amber:#7b5518;--wd-amber-fill:#fbf2df;--wd-green:#2c522d;--wd-green-fill:#e9f5e9;--wd-rose:#984646;--wd-rose-fill:#fcedec;--wd-violet:#4d335c;--wd-violet-fill:#f5eef9;--wd-teal:#0f766e;--wd-teal-fill:#e3f5f3;--wd-orange:#762f06;--wd-orange-fill:#fceee4;--wd-slate:#464e57;--wd-slate-fill:#eaedf2;--wd-bg:transparent;--wd-surface:#f4f4f2;--wd-surface-2:#ebebe7;--wd-border:#e2e2dd;--wd-fg:#1d1d1f;--wd-muted:#5c6067;--wd-subtle:#8b9098;--wd-accent:#0f766e;--wd-font-sans:Inter,&quot;Noto Sans SC&quot;,-apple-system,BlinkMacSystemFont,&quot;PingFang SC&quot;,&quot;HarmonyOS Sans SC&quot;,MiSans,&quot;Noto Sans CJK SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;--wd-font-mono:&quot;JetBrains Mono&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Noto Sans SC&quot;,&quot;PingFang SC&quot;,monospace;--wd-font-hand:Excalifont,Virgil,&quot;Noto Sans SC&quot;,&quot;PingFang SC&quot;,sans-serif}@media (prefers-color-scheme:dark){.wisp-d{--wd-blue:#a9cbef;--wd-blue-fill:#1a2634;--wd-amber:#f2c681;--wd-amber-fill:#2e2515;--wd-green:#84b585;--wd-green-fill:#1a281c;--wd-rose:#