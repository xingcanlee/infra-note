<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="wisp-d" viewBox="0 0 715 403" width="715" height="403" role="img" aria-labelledby="d-05-ced-prefix-arch-title d-05-ced-prefix-arch-desc" data-wisp-diagram="1" data-source="05-ced-prefix-arch.drawio" data-style="clean" data-page="05-ced-prefix"><title id="d-05-ced-prefix-arch-title">05-ced-prefix</title><desc id="d-05-ced-prefix-arch-desc">Causal Encoder-Decoder（CED）Prefill 算力减半；Causal Encoder（L0..L19，激活 ~8B） 处理完整长度 N · L2–19 (m=2) 生成 1.5 份全局 KV；编码器顶层隐状态 H_{L/2}（一次性投影源）；直接投影 L20..L39 全局 KV：C_l = H_{L/2} W_l^{KV} 只需在 L20 写入 1.0 份 m=1 主 KV，免跑上层 MoE；DecoderReplayLayers（L20..L39，末尾 n_win=128） 只对最后 128 个 token 跑局部 SWA Prefill 降至 O(NL/2)；智…</desc><style data-wisp-vars="1">.wisp-d{--wd-blue:#2f5783;--wd-blue-fill:#e9f2fb;--wd-amber:#7b5518;--wd-amber-fill:#fbf2df;--wd-green:#2c522d;--wd-green-fill:#e9f5e9;--wd-rose:#984646;--wd-rose-fill:#fcedec;--wd-violet:#4d335c;--wd-violet-fill:#f5eef9;--wd-teal:#0f766e;--wd-teal-fill:#e3f5f3;--wd-orange:#762f06;--wd-orange-fill:#fceee4;--wd-slate:#464e57;--wd-slate-fill:#eaedf2;--wd-bg:transparent;--wd-surface:#f4f4f2;--wd-surface-2:#ebebe7;--wd-border:#e2e2dd;--wd-fg:#1d1d1f;--wd-muted:#5c6067;--wd-subtle:#8b9098;--wd-accent:#0f766e;--wd-font-sans:Inter,&quot;Noto Sans SC&quot;,&quot;Wisp CJK Fallback&quot;,-apple-system,BlinkMacSystemFont,&quot;PingFang SC&quot;,&quot;HarmonyOS Sans SC&quot;,MiSans,&quot;Noto Sans CJK SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;--wd-font-mono:&quot;JetBrains Mono&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Noto Sans SC&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,monospace;--wd-font-hand:Excalifont,Virgil,&quot;Noto Sans SC&quot;,&quot;PingFang SC&quot;,sans-serif}@media (prefers-color-scheme:dark){.wisp-d{--wd-blue:#a9cbef;--wd-blue-fill:#1a2634;--wd-amber:#f2c681;--wd-amber-fill:#2e2515;--wd-green:#84b585;--wd-green-fill:#1a281c;--wd-rose:#eda9aa;--wd-rose-fill:#341f1f;--wd-violet:#