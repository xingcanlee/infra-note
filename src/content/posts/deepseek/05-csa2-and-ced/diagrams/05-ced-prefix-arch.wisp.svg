<div style="box-sizing:border-box;font-size:0;text-align:left;color:var(--wd-green, #2c522d)"><div style="display:inline-block;font-size:12px;font-family:var(--wd-font-sans);color:var(--wd-green, #2c522d);line-height:1.2;pointer-events:all;font-weight:bold;white-space:normal;word-wrap:normal">智能体多轮分级存储与 SWA 有界重放（§3.2）</div></div></div></foreignObject><text x="374" y="33" fill="var(--wd-green, #2c522d)" font-family="var(--wd-font-sans)" font-size="12" font-weight="bold">智能体多轮分级存储与 SWA 有界重放（§3.2）</text></switch></g><g data-cell-id="ssd"><rect width="304" height="72" x="376" y="48" fill="var(--wd-green-fill, #e9f5e9)" stroke="var(--wd-green, #2c522d)" stroke-width="2" pointer-events="all" rx="4" ry="4"/><switch><foreignObject width="100%" height="100%" pointer-events="none" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:unsafe center;justify-content:unsafe center;width:298px;height:1px;padding-top:84px;margin-left:379px"><div style="box-sizing:border-box;font-size:0;text-align:center;color:var(--wd-fg, #1d1d1f)"><div style="display:inline-block;font-size:12px;font-family:var(--wd-font-sans);color:var(--wd-fg, #1d1d1f);line-height:1.2;pointer-events:all;white-space:normal;word-wrap:normal">SSD 持久化前缀池（TTL &gt;= 72 小时）<br/>只存全局 KV（890 B/tok），体积仅为 V4 的 1/8<br/>剔除短寿命 SWA KV，命中后直接恢复长前缀全局 KV</div></div></div></foreignObject><text x="528" y="74" fill="var(--wd-fg, #1d1d1f)" font-family="var(--wd-font-sans)" font-size="12" text-anchor="middle"><tspan x="528" y="74">SSD 持久化前缀池（TTL &gt;= 72 小时）</tspan><tspan x="528" y="88">只存全局 KV（890 B/tok），体积仅为 V4 的 1/8</tspan><tspan x="528" y="102">剔除短寿命 SWA KV，命中后直接恢复长前缀全局 KV</tspan></text></switch></g><g data-cell-id="dram"><rect width="304" height="72" x="376" y="152" fill="var(--wd-blue-fill, #e9f2fb)" stroke="var(--wd-blue, #2f5783)" stroke-width="1.25" pointer-events="all" rx="4" ry="4" transform="translate(.5 .5)"/><switch><foreignObject width="100%" height="100%" pointer-events="none" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:unsafe center;justify-content:unsafe center;width:298px;height:1px;padding-top:188px;margin-left:379px"><div style="box-sizing:border-box;font-size:0;text-align:center;color:var(--wd-fg, #1d1d1f)"><div style="display:inline-block;font-size:12px;font-family:var(--wd-font-sans);color:var(--wd-fg, #1d1d1f);line-height:1.2;pointer-events:all;white-space:normal;word-wrap:normal">Host DRAM 热缓冲池（10% RAM · 分钟级 TTL）<br/>只缓存 Prompt 尾与输出尾两处 SWA 快照<br/>活跃多轮直接命中，过期即刻回收给新会话</div></div></div></foreignObject><text x="528" y="178" fill="var(--wd-fg, #1d1d1f)" font-family="var(--wd-font-sans)" font-size="12" text-anchor="middle"><tspan x="528" y="178">Host DRAM 热缓冲池（10% RAM · 分钟级 TTL）</tspan><tspan x="528" y="192">只缓存 Prompt 尾与输出尾两处 SWA 快照</tspan><tspan x="528" y="206">活跃多轮直接命中，过期即刻回收给新会话</tspan></text></switch></g><g data-cell-id="miss"><rect width="304" height="112" x="376" y="256" fill="var(--wd-amber-fill, #fbf2df)" stroke="var(--wd-amber, #7b5518)" stroke-width="2" pointer-events="all" rx="4" ry="4"/><switch><foreignObject width="100%" height="100%" pointer-events="none" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:unsafe center;justify-content:unsafe center;width:298px;height:1px;padding-top:312px;margin-left:379px"><div style="box-sizing:border-box;font-size:0;text-align:center;color:var(--wd-fg, #1d1d1f)"><div style="display:inline-block;font-size:12px;font-family:var(--wd-font-sans);color:var(--wd-fg, #1d1d1f);line-height:1.2;pointer-events:all;white-space:normal;word-wrap:normal">全局命中但 SWA 过期时的兜底策略<br/>Encoder SWA Bounded Replay：<br/>仅回放命中点前最后 n_win=128 个 token 恢复 SWA<br/>（无需全网重跑 L×n_win=5120 步）<br/>随后仅对新增短后缀生成全局 KV + SWA KV</div></div></div></foreignObject><text x="528" y="288" fill="var(--wd-fg, #1d1d1f)" font-family="var(--wd-font-sans)" font-size="12" text-anchor="middle"><tspan x="528" y="288">全局命中但 SWA 过期时的兜底策略</tspan><tspan x="528" y="302">Encoder SWA Bounded Replay：</tspan><tspan x="528" y="316">仅回放命中点前最后 n_win=128 个 token 恢复 SWA</tspan><tspan x="528" y="330">（无需全网重跑 L×n_win=5120 步）</tspan><tspan x="528" y="344">随后仅对新增短后缀生成全局 KV + SWA KV</tspan></text></switch></g><g data-cell-id="te1"><path fill="none" stroke="var(--wd-fg, #1d1d1f)" stroke-miterlimit="10" stroke-width="1.25" d="M452.5 120.5v25.16" pointer-events="stroke"/><path fill="var(--wd-fg, #1d1d1f)" stroke="var(--wd-fg, #1d1d1f)" stroke-miterlimit="10" stroke-width="1.25" d="m452.5 151.1-3.62-7.25 3.62 1.81 3.63-1.81Z" pointer-events="all"/></g><g data-cell-id="lbl_te1"><path fill="none" stroke="none" d="M464 120h80v24h-80z" pointer-events="all"/><switch><foreignObject width="100%" height="100%" pointer-events="none" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:unsafe center;justify-content:unsafe flex-start;width:78px;height:1px;padding-top:132px;margin-left:466px"><div style="box-sizing:border-box;font-size:0;text-align:left;color:var(--wd-muted, #5c6067)"><div style="display:inline-block;font-size:12px;font-family:var(--wd-font-sans);color:var(--wd-muted, #5c6067);line-height:1.2;pointer-events:all;white-space:normal;word-wrap:normal">全局命中</div></div></div></foreignObject><text x="466" y="136" fill="var(--wd-muted, #5c6067)" font-family="var(--wd-font-sans)" font-size="12">全局命中</text></switch></g><g data-cell-id="te2"><path fill="none" stroke="var(--wd-fg, #1d1d1f)" stroke-miterlimit="10" stroke-width="1.25" d="M604.5 224.5v25.16" pointer-events="stroke"/><path fill="var(--wd-fg, #1d1d1f)" stroke="var(--wd-fg, #1d1d1f)" stroke-miter