# 只用于开发期跑测试：`uv run --project skills/wisp-diagram/scripts pytest skills/wisp-diagram/scripts/tests`
# （或在本目录 `uv run pytest`）。日常使用直接 `uv run wisp_diagram.py …`，依赖由脚本头部的 PEP 723 声明提供。
[project]
name = "wisp-diagram-scripts"
version = "0.2.0"
description = "wisp-diagram skill 的脚本（Python + uv）"
requires-python = ">=3.11"
dependencies = [
  "playwright==1.64.1",
  "fonttools[woff]>=4.53",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
